workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - content_enterprise/**/*
        - content_community/**/*
        - content_shared/**/*
        - .gitlab-ci.yml

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1
  TEMPLATES_DIR: docs_templates
  ZIP_NEXUS_BUILD_DIR: build/zip_nexus
  TEST_DEPLOY_BASE_DIR: "/var/www/html/docs"
  TEST_DEPLOY_DIR_HTML: $TEST_DEPLOY_BASE_DIR/$DOCS_ID/$CI_COMMIT_REF_NAME
  TEST_DEPLOY_DIR_PDF_TPL: $TEST_DEPLOY_BASE_DIR/$DOCS_ID
  ARCHIVE_DIR: $TEST_DEPLOY_BASE_DIR/archive/$DOCS_ID/$RELEASE_ID
  PROD_SERVER: azuldocs@cdn-access.azulsystems.com
  STAGING_DIR: "/mnt/efs/docs.azul.com/staging-public_html/$DOCS_ID"
  PROD_DIR: "/mnt/efs/docs.azul.com/public_html/$DOCS_ID"
  VERSION_DIRECTORY: "version"

# Build matrix — one instance per docs set.
# content_shared is merged into each build (mirrors build_html_locally.sh).
.docs_matrix: &docs_matrix
  parallel:
    matrix:
      - DOCS_ID: payara
        CONTENT_DIR: content_enterprise
        HTML_BUILD_DIR: build/html_enterprise
        PDF_BUILD_DIR: build/pdf_enterprise
        TPL_BUILD_DIR: build/tpl_enterprise
        INDEX_GROUP_LABEL: "Azul Payara"
        PDF_FILE_NAME: "azul-payara-documentation"
        SITE_URL: https://docs.azul.com/payara
        VERSION: 7
      - DOCS_ID: payara-community
        CONTENT_DIR: content_community
        HTML_BUILD_DIR: build/html_community
        PDF_BUILD_DIR: build/pdf_community
        TPL_BUILD_DIR: build/tpl_community
        INDEX_GROUP_LABEL: "Azul Payara Community"
        PDF_FILE_NAME: "azul-payara-community-documentation"
        SITE_URL: https://docs.azul.com/payara-community
        VERSION: 7

# Template for jobs that use HTML templates (depends on the "get_templates" job).
.cache_job: &cache_configuration
  needs: [get_templates]
  cache:
    paths:
      - ${TEMPLATES_DIR}/
      - vendor/bundle/
    policy: pull

stages:
  - prepare
  - build
  - deploy
  - release

get_templates:
  stage: prepare
  script:
    - rm -rf ${TEMPLATES_DIR}
    #- git clone --depth 1 https://gitlab.azulsystems.com/docs/docs-templates ${TEMPLATES_DIR}
    - git clone --branch feature/payara --depth 1 https://gitlab.azulsystems.com/docs/docs-templates ${TEMPLATES_DIR}/
    - ls -lR ${TEMPLATES_DIR}
  cache:
    paths:
      - ${TEMPLATES_DIR}/
  variables:
    GIT_STRATEGY: none

docs_html:
  stage: build
  # Serialize both matrix instances on the same runner: doc-builder.rb uses a
  # hardcoded /tmp/build_docs working directory, so parallel builds on a shell
  # executor race and destroy each other's cwd.
  resource_group: docs_html_build
  <<: [*docs_matrix, *cache_configuration]
  script:
    - |
      echo "Building HTML for ${DOCS_ID} (${CONTENT_DIR}) version ${VERSION}"
      MERGED=build/merged-${DOCS_ID}
      rm -rf ${MERGED}
      mkdir -p ${MERGED}
      cp -a ${CONTENT_DIR}/. ${MERGED}/
      cp -a content_shared/. ${MERGED}/
      ruby ${TEMPLATES_DIR}/build.rb \
        --export-public-markdown --generate-sitemap --site-url ${SITE_URL} \
        --generate-index --index-group-id "${DOCS_ID}" --index-group-label "${INDEX_GROUP_LABEL}" --index-version "${VERSION}" \
        -d ${MERGED} -o ${HTML_BUILD_DIR}/${VERSION} -a ca -a RELEASE_ID=${VERSION} --page-extension ".html"
      rm -rf ${MERGED}
      echo "Generated HTML:"
      ls -l ${HTML_BUILD_DIR}
  artifacts:
    paths:
      - $HTML_BUILD_DIR
    name: docs-html-${DOCS_ID}
  interruptible: true

docs_pdf:
  stage: build
  resource_group: docs_html_build
  <<: [*docs_matrix, *cache_configuration]
  script:
    - |
      RELEASE_ID=$(grep "^release-id" ${CONTENT_DIR}/project.properties | cut -d'=' -f2 | tr -d ' ')
      echo "Building PDF for ${DOCS_ID} (${CONTENT_DIR}) release ${RELEASE_ID}"

      MERGED=build/merged-${DOCS_ID}
      rm -rf ${MERGED}
      mkdir -p ${MERGED}
      cp -a ${CONTENT_DIR}/. ${MERGED}/
      cp -a content_shared/. ${MERGED}/

      mkdir -p ${PDF_BUILD_DIR}/${VERSION}

      ruby ${TEMPLATES_DIR}/build.rb \
        -d ${MERGED} \
        -f pdf \
        -a pdf_file_name="${PDF_FILE_NAME}-${RELEASE_ID}" \
        -a RELEASE_ID=${RELEASE_ID} \
        -a version-label="Release " \
        -a revnumber="${RELEASE_ID}" \
        -o ${PDF_BUILD_DIR}/${VERSION}

      rm -rf ${MERGED}
      echo "Generated PDFs:"
      ls -lR ${PDF_BUILD_DIR}
  interruptible: true
  artifacts:
    paths:
      - ${PDF_BUILD_DIR}/*
    name: docs-pdf-${DOCS_ID}

deploy_to_test_server:
  stage: deploy
  resource_group: test_server-${DOCS_ID}
  <<: *docs_matrix
  needs: [docs_html,docs_pdf]
  script:
    - |
      rm -rf ${TEST_DEPLOY_DIR_HTML}/

      echo "Uploading HTML ${VERSION} to TEST server in directory '${TEST_DEPLOY_DIR_HTML}'"
      mkdir -p ${TEST_DEPLOY_DIR_HTML}
      cp -R ${HTML_BUILD_DIR}/${VERSION}/* ${TEST_DEPLOY_DIR_HTML}/

      PDF_DIR_SRC=${PDF_BUILD_DIR}/${VERSION}
      PDF_DIR_DEST=${TEST_DEPLOY_DIR_PDF_TPL}/pdfs/${VERSION}
      if [ -d "${PDF_DIR_SRC}" ]; then
        if [ "$(ls -A ${PDF_DIR_SRC})" ]; then
          echo "Uploading PDFs from ${PDF_DIR_SRC} to TEST server in directory '${PDF_DIR_DEST}'"
          mkdir -p ${PDF_DIR_DEST}
          cp ${PDF_DIR_SRC}/* ${PDF_DIR_DEST}
        else
          echo "No PDFs to be uploaded for ${VERSION}, ${PDF_DIR_SRC} is empty"
        fi
      fi

      TLPS_DIR_SRC=${TPL_BUILD_DIR}/${VERSION}
      TLPS_DIR_DEST=${TEST_DEPLOY_DIR_PDF_TPL}/tpls/${VERSION}
      if [ -d "${TLPS_DIR_SRC}" ]; then
        if [ "$(ls -A ${TLPS_DIR_SRC})" ]; then
          echo "Uploading TPLs from ${TLPS_DIR_SRC} to TEST server in directory '${TLPS_DIR_DEST}'"
          mkdir -p ${TLPS_DIR_DEST}
          cp ${TLPS_DIR_SRC}/* ${TLPS_DIR_DEST}
        else
          echo "No TPLs to be uploaded for ${VERSION}, ${TLPS_DIR_SRC} is empty"
        fi
      fi
  variables:
    GIT_STRATEGY: none
  environment:
    name: test
    url: http://doc-builder.azulsystems.com/$DOCS_ID/$CI_COMMIT_REF_NAME

deploy_to_staging_server:
  stage: deploy
  <<: *docs_matrix
  needs: [docs_html,docs_pdf]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      echo "Uploading HTML ${VERSION} to STAGING server as CURRENT"
      rsync -vahze ssh ${HTML_BUILD_DIR}/${VERSION}/* ${PROD_SERVER}:${STAGING_DIR}
      
      echo "Uploading HTML ${VERSION} to STAGING server in version directory '${VERSION_DIRECTORY}/${VERSION}'"
      ssh ${PROD_SERVER} mkdir -p ${STAGING_DIR}/${VERSION_DIRECTORY}/${VERSION}
      rsync -vahze ssh ${HTML_BUILD_DIR}/${VERSION}/* ${PROD_SERVER}:${STAGING_DIR}/${VERSION_DIRECTORY}/${VERSION}
      
      echo "Uploading PDFs ${VERSION} to STAGING server in directory 'pdfs/${VERSION}'"
      if [ -d "${PDF_BUILD_DIR}/${VERSION}" ]; then
        ssh ${PROD_SERVER} mkdir -p ${STAGING_DIR}/pdfs/${VERSION}
        rsync -vahze ssh ${PDF_BUILD_DIR}/${VERSION}/* ${PROD_SERVER}:${STAGING_DIR}/pdfs/${VERSION}
      fi

deploy_to_prod_server:
  stage: deploy
  <<: *docs_matrix
  needs: [docs_html,docs_pdf,deploy_to_staging_server]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      echo "Uploading HTML ${VERSION} to PRODUCTION server as CURRENT"
      rsync -vahze ssh ${HTML_BUILD_DIR}/${VERSION}/* ${PROD_SERVER}:${PROD_DIR}
      
      echo "Uploading HTML ${VERSION} to PRODUCTION server version directory '${VERSION_DIRECTORY}/${VERSION}'"
      ssh ${PROD_SERVER} mkdir -p ${PROD_DIR}/${VERSION_DIRECTORY}/${VERSION}
      rsync -vahze ssh ${HTML_BUILD_DIR}/${VERSION}/* ${PROD_SERVER}:${PROD_DIR}/${VERSION_DIRECTORY}/${VERSION}
      
      echo "Uploading PDFs ${VERSION} to PRODUCTION server in directory 'pdfs/${VERSION}'"
      if [ -d "${PDF_BUILD_DIR}/${VERSION}" ]; then
        ssh ${PROD_SERVER} mkdir -p ${PROD_DIR}/pdfs/${VERSION}
        rsync -vahze ssh ${PDF_BUILD_DIR}/${VERSION}/* ${PROD_SERVER}:${PROD_DIR}/pdfs/${VERSION}
      fi
      
      # Start the purge CDN cache pipeline
      - "curl -X POST -F token=${CICD_TRIGGER_TOKEN_PURGE} -F ref=main https://gitlab.azulsystems.com/api/v4/projects/2016/trigger/pipeline"
  when: manual
  only:
    - main-7

push_docs_to_nexus:
  stage: deploy
  <<: *docs_matrix
  needs: [docs_html]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      export TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
      export ZIP_FILE="docs-${DOCS_ID}-${TIMESTAMP}-${CI_PIPELINE_ID}.zip"
      echo "Building ZIP ${ZIP_FILE} in ${ZIP_NEXUS_BUILD_DIR} for upload to Nexus"
      rm -rf ${ZIP_NEXUS_BUILD_DIR}
      mkdir -p ${ZIP_NEXUS_BUILD_DIR}

      echo "Copy generated HTML"
      mkdir -p ${ZIP_NEXUS_BUILD_DIR}/html/
      cp -R ${HTML_BUILD_DIR}/* ${ZIP_NEXUS_BUILD_DIR}/html/

      echo "Create ZIP with all the files"
      cd ${ZIP_NEXUS_BUILD_DIR}
      zip -r ${ZIP_FILE} html

      echo "Generated files:"
      ls -l

      echo "Uploading the ZIP to Nexus"
      curl --fail --show-error --retry 3 --retry-all-errors -u "${CM_NEXUS_USER}:${CM_NEXUS_PASS}" --upload-file ${ZIP_FILE} ${CM_NEXUS_PATH}/repository/docs/${DOCS_ID}/${ZIP_FILE}
  only:
    - main-7
  artifacts:
    paths:
      - ${ZIP_NEXUS_BUILD_DIR}/*.zip
    name: nexus-upload-${DOCS_ID}
