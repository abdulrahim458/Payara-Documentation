# DRY-RUN version — safe to run without creating any GitHub releases.
# Verifies credentials, repo access, release notes file, and adoc→markdown conversion.
# Nothing is created or deleted on GitHub.
# Delete this branch once testing is confirmed.

variables:
  ENTERPRISE_7_RELEASE_VERSION: ""
  COMMUNITY_7_RELEASE_VERSION: ""

.github-release-tools:
  image: ubuntu:22.04
  before_script:
    - apt-get update -y
    - apt-get install -y asciidoc pandoc curl git
    - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    - apt-get update && apt-get install -y gh

# ----------------------------------------------------------------------------
# DRY RUN — Enterprise-7
# Checks: credentials, repo access, tag pre-existence, adoc conversion
# Does NOT create a release or delete any branch
# ----------------------------------------------------------------------------
release:dry-run-enterprise-7:
  extends: .github-release-tools
  stage: release
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - |
      set -euo pipefail
      VERSION="${ENTERPRISE_7_RELEASE_VERSION}"
      if [ -z "${VERSION}" ]; then
        echo "ERROR: Set ENTERPRISE_7_RELEASE_VERSION when triggering the pipeline (e.g. 7.2.0)"
        exit 1
      fi

      TAG="payara-enterprise-${VERSION}"
      RELEASE_BRANCH="Payara-Enterprise-${VERSION}-Release"
      GITHUB_REPO="payara/Payara-Enterprise"
      NOTES_FILE="${CI_PROJECT_DIR}/content_enterprise/release-notes/release-notes-${VERSION}.adoc"

      echo "=========================================="
      echo " DRY RUN — Enterprise-7 ${VERSION}"
      echo "=========================================="

      echo ""
      echo "--- [1/4] Checking GitHub credentials ---"
      gh repo view "${GITHUB_REPO}" --json name,isPrivate,defaultBranchRef \
        --jq '"Repo: \(.name) | Private: \(.isPrivate) | Default branch: \(.defaultBranchRef.name)"'
      echo "Credentials OK"

      echo ""
      echo "--- [2/4] Checking tag ${TAG} does not already exist ---"
      TAG_COUNT=$(git ls-remote --tags "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" "${TAG}" | wc -l)
      if [ "${TAG_COUNT}" -gt 0 ]; then
        echo "ERROR: Tag ${TAG} already exists — release would be blocked"
        exit 1
      fi
      echo "Tag ${TAG} does not exist yet — OK"

      echo ""
      echo "--- [3/4] Checking release branch ${RELEASE_BRANCH} exists ---"
      BRANCH_COUNT=$(git ls-remote --heads "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" "${RELEASE_BRANCH}" | wc -l)
      if [ "${BRANCH_COUNT}" -eq 0 ]; then
        echo "WARNING: Release branch ${RELEASE_BRANCH} not found on GitHub — target branch for release does not exist"
      else
        echo "Release branch ${RELEASE_BRANCH} found — OK"
      fi

      echo ""
      echo "--- [4/4] Checking release notes and converting adoc → markdown ---"
      if [ ! -f "${NOTES_FILE}" ]; then
        echo "ERROR: Release notes not found: ${NOTES_FILE}"
        exit 1
      fi
      echo "Found: ${NOTES_FILE}"
      asciidoc -b docbook "${NOTES_FILE}"
      NOTES_XML="${NOTES_FILE%.adoc}.xml"
      NOTES_MD="${NOTES_FILE%.adoc}.md"
      iconv -t utf-8 "${NOTES_XML}" | pandoc -f docbook -t markdown_strict --wrap=none | iconv -f utf-8 > "${NOTES_MD}"
      echo "Converted successfully — first 10 lines of markdown:"
      head -10 "${NOTES_MD}"

      echo ""
      echo "=========================================="
      echo " DRY RUN PASSED — would have run:"
      echo "  gh release create ${TAG} \\"
      echo "    --repo ${GITHUB_REPO} \\"
      echo "    --title \"Azul Payara ${VERSION}\" \\"
      echo "    --target ${RELEASE_BRANCH} \\"
      echo "    --notes-file release-notes-${VERSION}.md \\"
      echo "    --draft=false"
      echo ""
      echo "  git push ... --delete ${RELEASE_BRANCH}"
      echo "=========================================="

